  expected: policy-admin has 2 of 2 pods ready; nothing fired. No step to take.
  facts:
    - ["2 of 2", "two of two", "both", "all 2", "healthy", 're:\b(?:2|two) (?:pods? (?:are )?)?ready\b']
  runbook: null
  step: null
  trap: none
  reads: [get_pod_status]
  class: confidential

