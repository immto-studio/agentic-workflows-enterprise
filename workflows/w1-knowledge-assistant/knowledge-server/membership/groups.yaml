# The reviewed map from the group names W1's pages use to Entra group object IDs (W1-D17).
#
# Owner: security engineering (lm-security-engineering). A change to this file goes through their
# review like any change to access, because the file decides which Entra group a page's
# access_groups entry means.
#
# - A page may name only a group listed here; the ingestion gate refuses any other.
# - The membership sync tracks these object IDs and nothing else. A second Entra group with the
#   same display name never counts: Entra doesn't keep display names unique, and members can
#   create security groups by default. A tracked ID that disappears stops the sync.
# - broad: true marks the groups nearly everyone holds. A Confidential or Restricted page may not
#   name one (W1-D18), and a membership table older than 36 hours grants only these (W1-D27).
#
# The object IDs are synthetic, like everything about Larkspur Mutual.
