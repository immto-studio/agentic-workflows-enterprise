# W1's gateway in the local lab: chapter 5's callbacks, W1's manifests, three aliases on Ollama.
#
# larkspur-embed is the embedding model the lab chose by measurement (eval/results/2026-10-29).
# Both chat aliases sit on gpt-oss:20b here; litellm.gemma.yaml puts them on gemma4:12b, which is
# how the evaluation compares the two. On AWS, larkspur-chat would be Nova Lite through the Canada
# profile and larkspur-chat-restricted the self-hosted model of chapter 9; on a laptop every
# destination is self-hosted, and model_info says so, because model_info is what the grid reads.
#
# Run (from workflows/w1-knowledge-assistant/gateway; without --host the proxy listens on all interfaces):
#   LITELLM_MASTER_KEY=<a local value> litellm --config litellm.config.yaml --host 127.0.0.1 --port 4012

model_list:
  - model_name: larkspur-embed
    litellm_params:
      model: ollama/qwen3-embedding:0.6b
      api_base: http://127.0.0.1:11434
      input_cost_per_token: 0
    model_info:
      id: local-qwen3-embedding
      mode: embedding
      region: ca-central-1
      jurisdiction: CA
      hosting: self-hosted
  - model_name: larkspur-chat
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://127.0.0.1:11434
      input_cost_per_token: 0
      output_cost_per_token: 0
      timeout: 300
    model_info:
      id: local-gpt-oss-20b-chat
      region: ca-central-1
      jurisdiction: CA
      hosting: self-hosted
  - model_name: larkspur-chat-restricted
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://127.0.0.1:11434
      input_cost_per_token: 0
      output_cost_per_token: 0
      timeout: 300
    model_info:
      id: local-gpt-oss-20b-restricted
      region: ca-central-1
      jurisdiction: CA
      hosting: self-hosted

litellm_settings:
  num_retries: 0
  callbacks: gateway_hooks.hooks
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
