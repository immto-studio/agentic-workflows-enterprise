# W2's gateway with both chat aliases on gemma4:12b: the second model of the evaluation.
#
# litellm.config.yaml puts the two aliases on gpt-oss:20b; this file puts them on gemma4:12b, and
# the evaluation compares the two result files. W2 carries Internal data only, so every call goes
# to larkspur-chat; the restricted alias is listed because W2's manifest names it. On a laptop every
# destination is self-hosted, and model_info says so, because model_info is what the grid reads.
# num_ctx asks Ollama for a 16k context window, as litellm.config.yaml does, for the same reason.
#
# Run (from workflows/w2-ops-assistant/gateway):
#   GATEWAY_CONFIG=litellm.gemma.yaml LITELLM_MASTER_KEY=<a local value> litellm --config litellm.gemma.yaml --host 127.0.0.1 --port 4013
#   (the callbacks read the destinations from GATEWAY_CONFIG, so it names the same file)

model_list:
  - model_name: larkspur-chat
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://127.0.0.1:11434
      num_ctx: 16384
      input_cost_per_token: 0
      output_cost_per_token: 0
      timeout: 300
    model_info:
      id: local-gemma4-12b-chat
      region: ca-central-1
      jurisdiction: CA
      hosting: self-hosted
  - model_name: larkspur-chat-restricted
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://127.0.0.1:11434
      num_ctx: 16384
      input_cost_per_token: 0
      output_cost_per_token: 0
      timeout: 300
    model_info:
      id: local-gemma4-12b-restricted
      region: ca-central-1
      jurisdiction: CA
      hosting: self-hosted

litellm_settings:
  num_retries: 0
  callbacks: gateway_hooks.hooks
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
