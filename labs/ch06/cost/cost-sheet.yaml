# AWS prices for the chapter 6 lab in ca-central-1, from AWS's Price List API, which carries the same
# rates as the pricing pages in machine-readable form. Each block names its offer file and the date
# AWS published it. Fetched on 2026-10-29. US dollars, on-demand, before tax.
fetched: 2026-10-29
currency: USD
source: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/<offer>/current/<region>/index.json

agentcore:
  offer: AmazonBedrockAgentCore, ca-central-1, published 2026-10-19
  runtime: {vcpu_hour: 0.0895, gb_hour: 0.00945}
  gateway: {per_invocation: 0.000005, per_search_call: 0.000025, per_tool_indexed_month: 0.0002, vpc_target_per_gb: 0.006}
  memory_short_term: {ingest_per_gb: 1.00, read_per_gb: 0.20, stored_gb_month: 0.10}
  not_in_the_offer_file: [Identity, Policy]

bedrock:
  offer: AmazonBedrock, ca-central-1 and us-east-2, published 2026-10-28
  nova_lite:
    ca-central-1: {input_per_million: 0.064, output_per_million: 0.256, cache_read_per_million: 0.016}
    us-east-2: {input_per_million: 0.06, output_per_million: 0.24, cache_read_per_million: 0.015}
    billed_at: the Region the profile is called in, whichever destination serves the request
  titan_text_embeddings_v2:
    ca-central-1: {input_per_million: 0.10}
  guardrails_per_1000_text_units:   # a text unit is up to 1,000 characters, per policy
    ca-central-1: {content_filters: 0.15, denied_topics: 0.15, sensitive_information: 0.10, contextual_grounding: 0.10, word_filters: 0.0}

s3_vectors:
  offer: AmazonS3, ca-central-1, published 2026-10-15
  stored_gb_month: 0.066
  put_per_gb: 0.219
  query_requests_per_1000: 0.0027
  other_requests_per_1000: 0.06

kms:
  offer: awskms, ca-central-1, published 2026-10-26
  customer_managed_key_version_month: 1.00   # the workflow's key and the tool gateway's signing key

vpc_endpoints:
  offer: AmazonVPC, ca-central-1, published 2026-10-16
  interface_endpoint_hour: 0.011    # per endpoint, per Availability Zone it has a network interface in
  processed_per_gb: 0.01
  gateway_endpoint_hour: 0.0        # the S3 gateway endpoint is free

opensearch_serverless:
  offer: AmazonES, ca-central-1, published 2026-10-26
  indexing_ocu_hour: 0.266
  search_ocu_hour: 0.266
  us-east-2_ocu_hour: 0.24

# What sits in the account and bills by the hour whether or not anyone asks a question.
idle_month:
  hours: 730
  interface_endpoints:
    count: 8                          # terraform/network.tf
    zones: 2                          # one network interface per subnet
    usd: 128.48                       # 8 x 2 x 0.011 x 730
  kms_keys:
    count: 2                          # terraform/kms.tf
    usd: 2.00
  everything_else: 0                  # runtime, gateway, policy, guardrail and models bill per use; storage is cents
  usd: 130.48
  share_of_budget: 0.87               # of the lab's 150 USD (D-018)
  note: >-
    The endpoints are the lab's largest line. A production account shares one set of endpoints
    across every workflow in the VPC; a sandbox applies, runs the lab and destroys in a day
    (about 4.22 USD of endpoint time).

# The other vector store a customer-managed Knowledge Base can use in Canada. Classic collections bill a floor of
# OCUs around the clock; NextGen collections in a group whose minimum is 0 scale to zero after
# ten minutes without requests and take 10 to 30 seconds to wake. The lab uses S3 Vectors instead.
opensearch_serverless_trap:
  classic_minimum_ocus: 2
  classic_idle_month_usd: 388.36           # 2 x 0.266 x 730
  classic_dev_test_idle_month_usd: 194.18  # 1 OCU, without standby replicas
  nextgen_idle_month_usd: 0.0              # plus storage
  nextgen_wake_seconds: [10, 30]
  classic_idle_month_as_budgets: 2.59      # 388.36 / 150
