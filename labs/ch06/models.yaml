# The chat models Amazon Bedrock offered to a workload in ca-central-1 in October 2026, with what
# AWS said about each, and the one the AWS gateway pins for Confidential data (pinned: true; the
# larkspur-chat entry of gateway/litellm.aws.yaml). Read on 2026-10-29 from:
# - the model cards, https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-<provider>-<model>.html:
#   lifecycle, launch and earliest end-of-life dates, context, the inference profiles and, per
#   source Region, the destination Regions;
# - "Regional availability by models", .../userguide/models-region-compatibility.html;
# - "Model lifecycle (Legacy)", .../userguide/model-lifecycle-legacy.html: the scheduled Legacy and
#   end-of-life dates, which "can differ by AWS Region".
# The pages that state them are in LINKS.md, chapter 6, section 11.
#
# tests/test_models_and_costs.py fails when the pinned model is missing, can be served outside
# Canada, isn't Active, or has an end-of-life date within 180 days; when a model that can be served
# outside Canada is marked as processed in Canada; and when a pinned model or its fallback has a
# Legacy notice (legacy_from) without the weekly call that keeps the fallback's access: an account
# that doesn't use a Legacy model for fifteen days may lose it, and after three months in Legacy
# the price rises (extended_access_from).
amazon.nova-lite-v1:0:
  name: Amazon Nova Lite
  pinned: true
  access: geographic profile ca.amazon.nova-lite-v1:0, called in ca-central-1
  serves_from: [ca-central-1, ca-west-1]
  processed_in_canada: true
  lifecycle: Active
  launched: 2024-12-05
  eol_no_sooner_than: 2025-12-05     # passed: AWS may announce Legacy, with at least six months to end of life
  eol: null                          # none scheduled
  legacy_from: null                  # no notice yet
  extended_access_from: null
  context_tokens: 300000
  max_output_tokens: 10000
  tool_calling: client-side
  structured_outputs: false
  guardrails: true
  fallback: the same model In-Region in us-east-2, for Internal data
  fallback_weekly_call: false        # true from the day a Legacy notice arrives
mistral.mistral-large-2402-v1:0:
  name: Mistral Large (24.02)
  pinned: false
  access: In-Region in ca-central-1
  serves_from: [ca-central-1]
  processed_in_canada: true
  lifecycle: Active
  launched: 2024-02-26
  eol_no_sooner_than: 2025-02-26
  eol: null
  context_tokens: 32000
  max_output_tokens: 4000
  tool_calling: client-side
  structured_outputs: false
  guardrails: true
anthropic.claude-sonnet-5-5:
  name: Claude Sonnet 5.5
  pinned: false
  access: geographic profile us.anthropic.claude-sonnet-5-5, called in ca-central-1
  serves_from: [ca-central-1, us-east-1, us-east-2, us-west-2]
  processed_in_canada: false         # Internal and Public data only, under chapter 2's grid
  lifecycle: Active
  launched: 2026-09-28
  eol_no_sooner_than: 2027-09-28
  eol: null
  context_tokens: 1000000
  max_output_tokens: 128000
  tool_calling: client-side
  structured_outputs: true
  guardrails: true
anthropic.claude-3-haiku-20240307-v1:0:
  name: Claude 3 Haiku
  pinned: false
  access: In-Region in ca-central-1
  serves_from: [ca-central-1]
  processed_in_canada: true
  lifecycle: Legacy                  # in ca-central-1 from 2026-10-15; new customers can't use it
  launched: 2024-03-13
  eol: 2026-11-13
meta.llama3-70b-instruct-v1:0:
  name: Llama 3 70B Instruct
  pinned: false
  access: In-Region in ca-central-1
  serves_from: [ca-central-1]
  processed_in_canada: true
  lifecycle: Legacy                  # from 2026-09-30
  launched: 2024-04-18
  eol: 2027-03-30
