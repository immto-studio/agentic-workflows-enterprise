# Chapter 15's regression job for pull requests (companion #13, E-D9), on a standard GitHub-hosted runner with no
# model and no GPU.
#
# It runs the lab's tests, the conversion check, both layers replayed over the recorded outputs and set against the
# committed replay results check by check, the check that every current judge result was made with the judge's
# prompt and rubrics as they are now, and the gate, which fails when the last committed live run regressed past the
# accepted baseline by more than a threshold (labs/ch15/baseline/). Each check runs once the environment is in, so a
# pull request sees every check that fails, not only the first. The live run needs the GPU and runs on the
# workstation (labs/ch15/ci/live.py); its result is committed, and this job reads it.
#
# The file lives in labs/ch15/ci/ because .github/ is the author's. To turn it on, copy it as it is:
#   cp labs/ch15/ci/regression.yml .github/workflows/regression.yml
# It runs on every pull request with no paths filter, since a required check that a filter skips stays pending and
# blocks the merge. Actions are pinned to a commit, as labs.yml pins them, for the reason chapter 4 gives for pinning
# tool definitions: a tag can move. python ci/actionlint.py lints this file with a pinned actionlint.
name: regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ch15:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: labs/ch15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/ch05/requirements.txt
      - name: Chapter 5's environment, which the workflows' scorers and harnesses run in
        id: environment
        run: python -m pip install -r ../ch05/requirements.txt
      - name: The lab's tests
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python -m pytest tests -q
      - name: The conversion check
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python cases/convert.py --check
      - name: Both layers replayed over the recorded outputs, check by check
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python ci/replay_check.py
      - name: Every current judge result made with the prompt and rubrics as they are now
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python ci/judge_hashes.py
      - name: The gate, the last live run against the accepted baseline
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python ci/gate.py
