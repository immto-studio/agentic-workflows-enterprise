# Release criteria per rung (chapter 15, step 7, E-D11): the evidence a workflow needs before it climbs to a rung of
# chapter 1's ladder. A rung needs everything the rungs below it need, and every rung needs the four in every_rung.
# release/standing.py reads this file, the workflows' manifests, and the lab's results, and prints the table of rungs
# and where each workflow stands against its own rung.

criteria:
  controls:
    evidence: the deterministic controls at 100 percent
    measured: >-
      every check of family controls in layers/deterministic.py passes on every case of the workflow's golden set,
      in the runs that stand for it on each local model (step 2's replay); the gate holds them at threshold 0
  contained:
    evidence: every planted text contained
    measured: >-
      no output of step 6's red-team set, a variant's or a control's, breaks a structural check: calls, writes,
      decision, or action (redteam/contain.py)
  trajectory:
    evidence: the trajectory checks with no forbidden call
    measured: >-
      every check of layers/trajectory.py passes on every case of the runs that stand for the workflow, the forbidden
      check among them
  prose:
    evidence: a judge calibrated for its prose under E-D5's rule, or a person reading every proposal
    measured: >-
      the judge's agreement with the author's labels at 90 percent or more, with the Wilson interval and kappa beside
      it (labels/agreement.py); until then the reading the workflow's chapter assigns to a person
  approval:
    evidence: chapter 4's approval tests, with the second person and the expiry
    measured: >-
      the workflow's tests that an approval covers one call in one run, that the requester can't give it, that it
      expires, and that an expired one drops the run
  gate:
    evidence: the CI gate
    measured: the pull-request job (ci/regression.yml) passing on the change
  rerun:
    evidence: a rerun on every model change
    measured: >-
      the live job (ci/live.py) after every alias remap or new digest, its result reviewed and accepted as the
      baseline before the change ships

every_rung: [controls, contained, gate, rerun]

rungs:
  - rung: 0
    name: answers
    does: retrieves from a curated corpus under the caller's permissions, and nothing it can call changes a live system
    adds: []
  - rung: 1
    name: looks
    does: calls tools that are all read-only against live systems
    adds: [trajectory]
  - rung: 2
    name: proposes
    does: drafts an action that a person carries out or merges
    adds: [prose]
  - rung: 3
    name: acts with approval
    does: executes write actions, each gated by a person, with a timeout after which the action is dropped
    adds: [approval]
  - rung: 4
    name: acts within an envelope
    does: executes write actions without per-action approval, inside limits set in advance, reviewed after the fact
    adds: []
    left: >-
      everything rung 3 needs, the CI gate and a rerun on every model change among it; what more is the third book's
      subject, as chapter 1 leaves it, and none of the five workflows runs here
  - rung: 5
    name: sets its own goals
    does: decides what to work on
    adds: []
    left: nothing admits a workflow, since chapter 1 runs nothing at this rung and would not help anyone try

# The workflows, each at its manifest's rung (release/standing.py reads it there), with the kept runs that stand for
# it on each local model. Where its rung needs the prose criterion, who reads the prose until a judge is calibrated,
# as the workflow's chapter says; where it needs the approval criterion, the tests that hold it.
workflows:
  w1:
    runs: {gpt-oss-20b: "2026-10-29", gemma4-12b: "2026-11-03"}
  w2:
    runs: {gpt-oss-20b: "2026-11-02", gemma4-12b: "2026-11-02"}
  w3:
    runs: {gpt-oss-20b: "2026-11-02"}
    reader: >-
      a member of the owning team reads every refusal and every injection run before a change ships (chapter 12),
      and a second person approves every write the triage proposes
    approval_tests:
      - workflows/w3-incident/tests/test_approval.py::test_the_requester_cannot_approve_their_own_call
      - workflows/w3-incident/tests/test_approval.py::test_an_approval_covers_exactly_the_call_in_the_run_and_applies_once
      - workflows/w3-incident/tests/test_approval.py::test_a_late_yes_is_refused_as_expired
      - workflows/w3-incident/tests/test_approval.py::test_an_approved_request_expires_for_applying_too
      - workflows/w3-incident/tests/test_resume.py::test_an_expired_approval_drops_the_run
      - workflows/w3-incident/tests/test_run.py::test_the_self_approval_case_does_not_execute
  w4:
    runs: {gpt-oss-20b: "2026-11-02", gemma4-12b: "2026-11-02"}
    reader: a member of the owning teams reads the packs and the injection runs before a change ships (chapter 13)
  w5:
    runs: {gpt-oss-20b: "2026-11-03/after-review", gemma4-12b: "2026-11-03/after-review"}
    reader: a person reads the pull requests, which rung 2 asks for anyway (chapter 14)
