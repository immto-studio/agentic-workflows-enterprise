<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 15: label the sampled outputs</title>
<!-- Chapter 15, step 4 (E-D7). Served by labels/page.py on 127.0.0.1. Everything the page needs is in this file
     and the server's answers; it loads nothing from anywhere else, and the server's Content-Security-Policy
     refuses it any other origin. Every text from the server goes in through textContent, never as markup. -->
<style>
  :root { color-scheme: light dark; --line: #8886; --muted: #7a7a7a; --accent: #2a6f97; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; background: Canvas; color: CanvasText; }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; align-items: center;
           padding: .55rem 1.2rem; border-bottom: 1px solid var(--line); background: Canvas; }
  header .count { font-weight: 600; }
  header .keys { margin-left: auto; color: var(--muted); }
  progress { width: 11rem; }
  main { max-width: 64rem; margin: 0 auto; padding: .8rem 1.2rem 7rem; }
  .standard { color: var(--muted); font-size: .88rem; border-left: 3px solid var(--line); padding: .1rem .8rem; }
  .standard p { margin: .3rem 0; }
  h1 { font-size: 1.15rem; margin: 1rem 0 0; }
  .id { color: var(--muted); font: .85rem ui-monospace, Consolas, monospace; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1.3rem 0 .3rem; }
  .title { margin: 0 0 .4rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: .65rem .85rem; border: 1px solid var(--line);
        border-radius: 6px; font: 13.5px/1.45 ui-monospace, Consolas, monospace; }
  #output { border: 2px solid var(--accent); }
  .finished { font-size: 1.1rem; margin-top: 2.5rem; }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
             padding: .6rem 1.2rem; border-top: 1px solid var(--line); background: Canvas; }
  .actions input { flex: 1 1 18rem; font: inherit; padding: .35rem .6rem; }
  .actions .current { font-weight: 600; min-width: 9rem; }
  button { font: inherit; padding: .35rem .9rem; cursor: pointer; }
  .error { color: #c0392b; flex-basis: 100%; }
  .error:empty { display: none; }
</style>
</head>
<body>
<header>
  <span class="count" id="count">Loading the sampled outputs</span>
  <progress id="bar" max="1" value="0"></progress>
  <span id="where"></span>
  <span class="keys">R right &middot; W wrong &middot; N note &middot; B back one item</span>
</header>
<main>
  <div class="standard" id="standard"></div>
  <section id="item" hidden>
    <h1 id="name"></h1>
    <div class="id" id="item-id"></div>
    <h2>The rubric, as the judge read it</h2>
    <p class="title" id="title"></p>
    <pre id="criteria"></pre>
    <h2>The input and the reference</h2>
    <pre id="reference"></pre>
    <h2>The output</h2>
    <pre id="output"></pre>
  </section>
  <p class="finished" id="finished" hidden></p>
</main>
<div class="actions">
  <span class="current" id="current"></span>
  <input id="note" maxlength="1000" autocomplete="off" spellcheck="true"
         placeholder="Note, optional: N to type here, Enter or Esc to leave">
  <button id="right" type="button">Right (R)</button>
  <button id="wrong" type="button">Wrong (W)</button>
  <button id="back" type="button">Back (B)</button>
  <span class="error" id="error"></span>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let view = null;
let busy = false;

async function call(path, body) {
  const options = body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
  return data;
}

async function run(task) {
  if (busy) return;
  busy = true;
  $("error").textContent = "";
  try {
    await task();
  } catch (error) {
    $("error").textContent = "Nothing was saved: " + error.message;
  } finally {
    busy = false;
  }
}

function show(data) {
  view = data;
  $("count").textContent = data.done + " of " + data.total + " labeled";
  $("bar").max = data.total;
  $("bar").value = data.done;
  const item = data.item;
  $("item").hidden = !item;
  $("finished").hidden = Boolean(item);
  if (!item) {
    $("where").textContent = "";
    $("current").textContent = "";
    $("note").value = "";
    $("finished").textContent = "All " + data.total + " outputs are labeled, and every label is saved in " +
      "labels/labels-A.jsonl. B goes back to the last output; the page can be closed and the server stopped.";
    return;
  }
  $("where").textContent = "Output " + (data.at + 1) + " of " + data.total;
  $("name").textContent = item.name;
  $("item-id").textContent = item.id;
  $("title").textContent = item.title;
  $("criteria").textContent = item.criteria;
  $("reference").textContent = item.reference;
  $("output").textContent = item.output;
  $("current").textContent = item.label ? "Labeled " + item.label : "Not labeled yet";
  $("note").value = item.note || "";
  window.scrollTo(0, 0);
}

function label(value) {
  run(async () => {
    if (!view || !view.item) return;
    show(await call("/api/label", {id: view.item.id, label: value, note: $("note").value}));
  });
}

function back() {
  run(async () => {
    if (!view) return;
    const at = (view.item ? view.at : view.total) - 1;
    if (at >= 0) show(await call("/api/item?at=" + at));
  });
}

document.addEventListener("keydown", (event) => {
  if (event.target === $("note")) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      $("note").blur();
    }
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
  const key = event.key.toLowerCase();
  if (key === "r") label("right");
  else if (key === "w") label("wrong");
  else if (key === "b") back();
  else if (key === "n") $("note").focus();
  else return;
  event.preventDefault();
});
// A clicked button gives its focus back, so that Enter or Space cannot press it again on the next output.
for (const [id, action] of [["right", () => label("right")], ["wrong", () => label("wrong")], ["back", back]]) {
  $(id).addEventListener("click", (event) => {
    event.currentTarget.blur();
    action();
  });
}

run(async () => {
  const meta = await call("/api/meta");
  for (const text of meta.standard) {
    const paragraph = document.createElement("p");
    paragraph.textContent = text;
    $("standard").append(paragraph);
  }
  show(await call("/api/item"));
});
</script>
</body>
</html>
