# Prices for the chapter 9 cost comparison, in USD, as printed on 2026-10-28.
# Source: section 5 of chapter 9's fact sheet (LINKS.md, chapter 9), which cites
# the pages below. The book prints no absolute prices (style guide, amendment 4); it prints only
# what crossover.py derives from them. Re-check every number before using it for a decision.
as_of: 2026-10-28
hours_per_month: 730

# The token mix of the skeleton's golden set through the gateway: prompt tokens per completion
# token, measured on 2026-10-29 (gpt-oss:20b 5.31, gemma4:12b 4.87). A workflow with long
# retrieved context will have a higher ratio; pass your own with --input-per-output.
input_per_output: 5.0

hosted:
  bedrock-gpt-oss-120b-standard:
    input_per_million: 0.15
    output_per_million: 0.60
    source: https://aws.amazon.com/bedrock/pricing/ (us-east-1, Standard tier)

gpu:
  aws-p5.4xlarge-h100-on-demand:
    per_hour: 6.88
    gpus: 1
    memory_gb: 80
    source: https://aws.amazon.com/ec2/pricing/on-demand/ (us-east-1)
  aws-g6e.xlarge-l40s-on-demand:
    per_hour: 1.861
    gpus: 1
    memory_gb: 48
    source: https://aws.amazon.com/ec2/pricing/on-demand/ (us-east-1)
  gcp-g2-standard-4-l4-on-demand:
    per_hour: 0.7068
    gpus: 1
    memory_gb: 24
    source: https://cloud.google.com/products/compute/pricing/accelerator-optimized (us-central1)
