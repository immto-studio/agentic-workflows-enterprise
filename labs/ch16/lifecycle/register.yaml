# The gateway configurations the register must agree with: every deployment in each is a register deployment
# with the same identifier and alias, and every register deployment that names a configuration is in it.
gateways:
  litellm:
    - labs/ch06/gateway/litellm.aws.yaml
    - labs/ch09/gateway/litellm.config.yaml
    - labs/ch09/gateway/litellm.gemma.yaml
    - labs/ch09/gateway/litellm.k8s.yaml
    - labs/ch16/cloud/litellm.bedrock-ca.yaml
    - labs/ch16/cloud/litellm.bedrock-us.yaml
    - labs/ch16/lifecycle/litellm.current.yaml
    - labs/ch16/lifecycle/litellm.staging.yaml
    - labs/ch16/lifecycle/litellm.canary.yaml
    - workflows/w1-knowledge-assistant/gateway/litellm.config.yaml
    - workflows/w1-knowledge-assistant/gateway/litellm.gemma.yaml
    - workflows/w1-knowledge-assistant/gateway/litellm.bedrock.yaml
    - workflows/w2-ops-assistant/gateway/litellm.config.yaml
    - workflows/w2-ops-assistant/gateway/litellm.gemma.yaml
  terraform:
    - path: labs/ch07/terraform/runtime.tf
      reads: google model IDs under ${local.models}/, as labs/ch07/tests/test_models_and_costs.py reads them
    - path: labs/ch08/terraform/variables.tf
      reads: the chat_model variable's default (name and version), as labs/ch08/tests/test_models_and_costs.py reads it
  excluded:
    - path: labs/ch05/gateway/litellm.config.yaml
      why: its three deployments are chapter 5's fake backends (openai/fake-primary and the like), not models
    - path: labs/ch16/budget/litellm.config.yaml
      why: step 4's gateway on the same fakes
    - path: labs/ch16/capacity/
      why: step 5's and 5b's configurations on the fake provider
