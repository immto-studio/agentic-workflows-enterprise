# The model register (chapter 16, step 8, O-D14): one register for the three clouds and the local models, merged
# from chapters 6 to 9 and from what the gateways serve. Each model has one lifecycle (its stage, the date it
# retires, the replacement) and one or more deployments, each with the identifier the gateway pins it by. The
# facts come from the chapters' own registers and the fact sheets, each with the date it was read; the local
# digests were read from the portable Ollama 0.40.13 on 9 November 2026 (lifecycle/register.py --digests).
#
# The pin is what a gateway can hold a model to:
# - a local model: the digest Ollama reports for the tag, on the server that serves it, since two servers report
#   two digests for the same tag (below), or the weights' revision and SHA-256 list for the vLLM deployment;
# - a Bedrock model: its model ID or inference profile ID. Nova Lite's and the Legacy models' IDs carry a version
#   (`-v1:0`, a date), so a new version is a new ID. Claude 5.5's IDs carry no version and no date
#   (anthropic.claude-sonnet-5-5, anthropic.claude-haiku-5-5), so a change under one is invisible to this register,
#   and only chapter 15's live job (E-D9) would see it. The chapter states that limit;
# - a Foundry model: its name and version; a Google model: its model ID, which Google versions by the ID itself.
#
# lifecycle/register.py loads this file, checks it against every gateway configuration and Terraform file named
# under `gateways`, and prints what doesn't agree; lifecycle/retirement.py computes the retirement alert from it.
read_on: 2026-11-09

stages:
  aws:
    values: [Active, Legacy, EOL]
    source: >-
      AWS's model lifecycle pages as labs/ch06/models.yaml and LINKS.md, chapter 6 (section 11)
      quote them: Active; Legacy, the notice period before the end of life, at least six months for models launched
      before 7 September 2026, during which new customers can't adopt the model and an account that doesn't use it
      for fifteen days may lose it; EOL, after which requests fail and nothing migrates by itself.
  google:
    values: [preview, GA, retired]
    source: >-
      Google's "Model versions and lifecycle" as labs/ch07/models.yaml reads it (updated 2026-10-28): a stable model
      stays available at least twelve months after its release, a retirement date is never moved earlier, and
      the notice is at least 45 days (LINKS.md, chapter 7, S35).
  azure:
    values: [Preview, GA, Legacy, Deprecated, Retired]
    source: >-
      the Foundry Models lifecycle and support policy as labs/ch08/models.yaml and its tests hold it: Legacy
      (new deployments until deprecation), Deprecated (no longer available to new customers, decided per
      subscription), Retired (requests answer 410); a GA model's retirement is set eighteen months out and the
      notice is at least 60 days (LINKS.md, chapter 8, W11).
  larkspur:
    values: [candidate, serving, retired]
    source: >-
      the lab's own stages for a self-hosted model, since chapter 9 pins weights and digests and names no lifecycle:
      candidate, evaluated on the golden sets and behind no alias; serving, behind an alias in a gateway
      configuration; retired, removed from every gateway and from the model store.

