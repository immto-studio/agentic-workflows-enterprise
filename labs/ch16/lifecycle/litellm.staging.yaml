# Step 8's staging gateway (O-D14): the candidate, gemma4:12b, behind larkspur-chat, so that chapter 15's live job
# (labs/ch15/ci/live.py) runs W2's golden set on it and sets the run against the baseline. The restricted alias
# stays on the current model: W2's manifest names it, chapter 5's rules check the manifest's aliases against the
# configuration, and the candidate is for larkspur-chat alone. Both on the portable Ollama 0.40.13 on 11435. Gemma
# runs with thinking off, as every Gemma run of chapters 15 and 16 did (W5 found its thinking looping to the budget).
#
# Run (from workflows/w2-ops-assistant/gateway):
#   GATEWAY_CONFIG=<this file> LITELLM_MASTER_KEY=<a local value> litellm --config <this file> --host 127.0.0.1 --port 4019

model_list:
  - model_name: larkspur-chat
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://127.0.0.1:11435
      num_ctx: 16384
      think: false
      input_cost_per_token: 0
      output_cost_per_token: 0
      timeout: 300
    model_info:
      id: candidate-gemma4-12b-chat
      region: ca-central-1
      jurisdiction: CA
      hosting: self-hosted
  - model_name: larkspur-chat-restricted
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://127.0.0.1:11435
      num_ctx: 16384
      input_cost_per_token: 0
      output_cost_per_token: 0
      timeout: 300
    model_info:
      id: local-gpt-oss-20b-restricted
      region: ca-central-1
      jurisdiction: CA
      hosting: self-hosted

litellm_settings:
  num_retries: 0
  callbacks: gateway_hooks.hooks
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
