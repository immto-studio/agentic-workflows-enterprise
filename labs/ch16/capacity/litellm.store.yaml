# Step 5b's gateway (O-D8): step 4's database-backed gateway with its limiter on a shared store.
#
# Step 4's aliases, keys, callbacks and settings, unchanged, with Garnet (capacity/garnet.py) as the Redis LiteLLM
# coordinates through. LiteLLM's "What Needs Redis" page says to configure both halves: `router_settings`'s redis_*
# for the router's state (cooldowns, deployment counts) and a block for "everything coordinated proxy-wide". That
# block is `general_settings.coordination_redis`, which its "Redis and Valkey" page gives for "spend tracking,
# cross-pod rate limits, pod locks" without the response cache (litellm_settings.cache stays off, so no answer is
# ever served from the store). The keys' windows and counters then live in the store, written by LiteLLM's Lua
# scripts, and the proxy's in-memory cache keeps only a mirror. `store_hooks.hooks` alerts through step 4's webhook
# when the store can't be reached; it changes no request.
#
# Run (from labs/ch16/capacity): as litellm.outage.yaml, with DATABASE_URL and WEBHOOK_URL as step 4's, and
# CAPACITY_STORE_HOST, CAPACITY_STORE_PORT and CAPACITY_STORE_PASSWORD naming the store. capacity/run_drills.py
# starts everything this needs and stops it again.

model_list:
  - model_name: larkspur-chat
    litellm_params:
      model: openai/fake-primary
      api_base: os.environ/BUDGET_PRIMARY_URL
      api_key: not-used-by-the-fake
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      timeout: 5
    model_info: {id: primary, region: ca-central-1,
                 jurisdiction: CA, hosting: managed}

  - model_name: larkspur-chat-restricted  # the self-hosted model, chapter 9
    litellm_params:
      model: openai/fake-self-hosted
      api_base: os.environ/BUDGET_SELF_HOSTED_URL
      api_key: not-used-by-the-fake
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      timeout: 5
    model_info: {id: self-hosted, region: ca-central-1,
                 jurisdiction: CA, hosting: self-hosted}

litellm_settings:
  # the key must agree with the tags (ch05:164), then chapter 5's rules, limits, cost line and span
  callbacks: [binding_hooks.hooks, ch05_hooks.hooks, store_hooks.hooks]
  num_retries: 0
  drop_params: true
  # a key's 1mo budget resets at midnight on the 1st in this zone; the default is UTC
  timezone: America/Toronto
  # the default, written out: a spent budget answers 422, which the harness counts as a budget stop
  budget_exceeded_status_code: 422

router_settings:
  redis_host: os.environ/CAPACITY_STORE_HOST
  redis_port: os.environ/CAPACITY_STORE_PORT
  redis_password: os.environ/CAPACITY_STORE_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # budget alerts as a POST of LiteLLM's webhook event to WEBHOOK_URL; email alerts need the license
  alerting: ["webhook"]
  alert_types: ["budget_alerts"]
  coordination_redis:
    host: os.environ/CAPACITY_STORE_HOST
    port: os.environ/CAPACITY_STORE_PORT
    password: os.environ/CAPACITY_STORE_PASSWORD
