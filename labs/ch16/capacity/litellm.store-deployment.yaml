# Step 5b's fourth contention setup (O-D8): litellm.deployment.yaml with the gateway's state on the shared store.
#
# Step 5's deployment limits (tpm, rpm and max_parallel_requests on the primary, enforced under
# enforce_model_rate_limits) with the store of litellm.store.yaml: the router's counts through `router_settings`'s
# redis_*, the keys' through `general_settings.coordination_redis`, and `store_hooks.hooks` for the alert. Nothing
# else differs from litellm.deployment.yaml.
#
# Run (from labs/ch16/capacity): as litellm.store.yaml. capacity/run_drills.py starts everything this needs.

model_list:
  - model_name: larkspur-chat
    litellm_params:
      model: openai/fake-primary
      api_base: os.environ/CAPACITY_PRIMARY_URL
      api_key: not-used-by-the-fake
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      timeout: 5
      tpm: 100000                # the account's quota at the fake provider
      rpm: 300
      max_parallel_requests: 4   # explicit; without it the cap would come from rpm
    model_info: {id: primary, region: ca-central-1,
                 jurisdiction: CA, hosting: managed}

  - model_name: larkspur-chat-restricted
    litellm_params:
      model: openai/fake-self-hosted
      api_base: os.environ/CAPACITY_SELF_HOSTED_URL
      api_key: not-used-by-the-fake
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      timeout: 5
    model_info: {id: self-hosted, region: ca-central-1,
                 jurisdiction: CA, hosting: self-hosted}

litellm_settings:
  callbacks: [binding_hooks.hooks, ch05_hooks.hooks, store_hooks.hooks]
  num_retries: 0
  drop_params: true
  timezone: America/Toronto
  budget_exceeded_status_code: 422

router_settings:
  optional_pre_call_checks: ["enforce_model_rate_limits"]
  redis_host: os.environ/CAPACITY_STORE_HOST
  redis_port: os.environ/CAPACITY_STORE_PORT
  redis_password: os.environ/CAPACITY_STORE_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  alerting: ["webhook"]
  alert_types: ["budget_alerts"]
  coordination_redis:
    host: os.environ/CAPACITY_STORE_HOST
    port: os.environ/CAPACITY_STORE_PORT
    password: os.environ/CAPACITY_STORE_PASSWORD
