# Step 5b's store stopped, failing closed (O-D8): litellm.store-census.yaml with LiteLLM's fail-closed setting.
#
# Chapter 5 says Larkspur's budgets and rate limits fail closed, and that a managed gateway's default "has to be a
# decision rather than a discovery" (ch05:498). LiteLLM 1.106.6's limiter, when it can't check a key's counters in
# the store, carries on from its in-memory mirror unless `general_settings.fail_closed_rate_limit_enforcement` is
# true, in which case it refuses the call with 503 (`parallel_request_limiter_v3.py`). This file sets it; nothing
# else differs from litellm.store-census.yaml.
#
# Run (from labs/ch16/capacity): as litellm.store-census.yaml. capacity/run_drills.py starts everything this needs.

model_list:
  - model_name: larkspur-chat
    litellm_params:
      model: openai/fake-primary
      api_base: os.environ/BUDGET_PRIMARY_URL
      api_key: not-used-by-the-fake
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      timeout: 5
    model_info: {id: primary, region: ca-central-1,
                 jurisdiction: CA, hosting: managed}

  - model_name: larkspur-chat-restricted  # the self-hosted model, chapter 9
    litellm_params:
      model: openai/fake-self-hosted
      api_base: os.environ/BUDGET_SELF_HOSTED_URL
      api_key: not-used-by-the-fake
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      timeout: 5
    model_info: {id: self-hosted, region: ca-central-1,
                 jurisdiction: CA, hosting: self-hosted}

litellm_settings:
  # the key must agree with the tags (ch05:164), then chapter 5's rules, limits, cost line and span
  callbacks: [binding_hooks.hooks, ch05_hooks.hooks, census_hooks.hooks, store_hooks.hooks]
  num_retries: 0
  drop_params: true
  # a key's 1mo budget resets at midnight on the 1st in this zone; the default is UTC
  timezone: America/Toronto
  # the default, written out: a spent budget answers 422, which the harness counts as a budget stop
  budget_exceeded_status_code: 422

router_settings:
  redis_host: os.environ/CAPACITY_STORE_HOST
  redis_port: os.environ/CAPACITY_STORE_PORT
  redis_password: os.environ/CAPACITY_STORE_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # budget alerts as a POST of LiteLLM's webhook event to WEBHOOK_URL; email alerts need the license
  alerting: ["webhook"]
  alert_types: ["budget_alerts"]
  coordination_redis:
    host: os.environ/CAPACITY_STORE_HOST
    port: os.environ/CAPACITY_STORE_PORT
    password: os.environ/CAPACITY_STORE_PASSWORD
  fail_closed_rate_limit_enforcement: true
