# The dated price table of chapter 16's ledger (companion #14, O-D5 and O-D6).
#
# Every price is copied from a cost sheet of chapters 6 to 9, or, where no cost sheet has one, from
# section 8.8 of chapter 16's fact sheet (LINKS.md, chapter 16, section 8.8; read
# 2026-11-03). Each entry names its source, the date that source records, and the
# page the source cites. An entry copied from a cost sheet says where in the sheet (`sheet`), and a test
# reads the sheet and compares; an entry from the fact sheet carries its quote. A price no vendor
# publishes, or no source has, is null, with the reason or the vendor's own words. US dollars,
# on-demand, before tax.
#
# The book prints none of these numbers (style guide 12.4). It prints ratios and percentages of the
# manifests' budgets, which the ledger derives from them.
currency: USD
month_hours: 730   # the cost sheets' month (labs/ch06/cost/cost-sheet.yaml idle_month, labs/ch09/cost/cost-sheet.yaml)

# Chapter 6's design: the deployment that serves each alias on AWS ("Models and knowledge that stay in
# Canada", ch06:162; labs/ch06/gateway/litellm.aws.yaml). A cost line is priced at the deployment its
# alias names here, and a fallback at the deployment it fell back to, in that deployment's own Region.
design:
  larkspur-chat: nova-lite-ca
  larkspur-chat-fallback: nova-lite-us
  larkspur-chat-restricted: vllm-gpt-oss-20b
  larkspur-embed: titan-embed-v2-ca
fallbacks:
  larkspur-chat: larkspur-chat-fallback   # labs/ch06/gateway/litellm.aws.yaml, litellm_settings.fallbacks

# What serves an alias where, priced per million tokens. `gateway` is the gateway pair whose config the
# deployment belongs to (ledger/litellm.prices.yaml); `litellm_model` is the name LiteLLM is given.
deployments:
  - id: nova-lite-ca
    alias: larkspur-chat
    gateway: aws
    chapter: 6
    model: Amazon Nova Lite through its Canadian geographic profile
    litellm_model: bedrock/converse/ca.amazon.nova-lite-v1:0
    litellm_params: {aws_region_name: ca-central-1}
    region: ca-central-1
    serves_from: [ca-central-1, ca-west-1]
    input_per_million: 0.064
    output_per_million: 0.256
    cache_read_per_million: 0.016
    note: a profile bills at the price of the Region it is called in, whichever destination serves it
    source: labs/ch06/cost/cost-sheet.yaml
    sheet:
      input_per_million: [bedrock, nova_lite, ca-central-1, input_per_million]
      output_per_million: [bedrock, nova_lite, ca-central-1, output_per_million]
      cache_read_per_million: [bedrock, nova_lite, ca-central-1, cache_read_per_million]
    date: 2026-10-29   # fetched; AmazonBedrock offer for ca-central-1 published 2026-10-28
    page: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/ca-central-1/index.json
    confirmed:
      source: fact sheet, section 8.1
      date: 2026-11-03
      quote:
        - "$0.000064 per 1K tokens for CAN1-NovaLite-input-tokens in Canada (Central)"
        - "$0.000256 per 1K tokens for CAN1-NovaLite-output-tokens in Canada (Central)"

  - id: nova-lite-us
    alias: larkspur-chat-fallback
    gateway: aws
    chapter: 6
    model: Amazon Nova Lite In-Region in us-east-2, the Internal fallback
    litellm_model: bedrock/converse/amazon.nova-lite-v1:0
    litellm_params: {aws_region_name: us-east-2}
    region: us-east-2
    input_per_million: 0.06
    output_per_million: 0.24
    cache_read_per_million: 0.015
    source: labs/ch06/cost/cost-sheet.yaml
    sheet:
      input_per_million: [bedrock, nova_lite, us-east-2, input_per_million]
      output_per_million: [bedrock, nova_lite, us-east-2, output_per_million]
      cache_read_per_million: [bedrock, nova_lite, us-east-2, cache_read_per_million]
    date: 2026-10-29   # fetched; AmazonBedrock offer for us-east-2 published 2026-10-28
    page: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/us-east-2/index.json
    confirmed:
      source: fact sheet, section 8.1
      date: 2026-11-03
      quote:
        - "$0.00006 per 1K tokens for Nova Lite-input-tokens in us-east-2 (Ohio)"

  - id: vllm-gpt-oss-20b
    alias: larkspur-chat-restricted
    gateway: aws
    chapter: 9
    model: gpt-oss-20b on chapter 9's two vLLM replicas in ca-central-1
    litellm_model: hosted_vllm/gpt-oss-20b
    litellm_params: {api_base: "http://vllm-gpt-oss-20b.llm-serving.svc:8080/v1"}
    region: ca-central-1
    input_per_million: 0.0
    output_per_million: 0.0
    note: >-
      zero per token: the GPUs are billed by the hour (gpu, below) and allocated in the month. A deployment
      priced at exactly zero makes LiteLLM skip every budget check for its alias (fact sheet 8.1), so the
      alias's only stop at the gateway is each manifest's requests_per_minute
    source: labs/ch09/gateway/litellm.k8s.yaml
    date: 2026-10-29   # chapter 9's lab, labs/ch09/results/2026-10-29
    page: book ch09:198, "The deployment's price per token is zero"

  - id: titan-embed-v2-ca
    alias: larkspur-embed
    gateway: aws
    chapter: 6
    model: Amazon Titan Text Embeddings V2 in ca-central-1, the Knowledge Base's embedding model
    litellm_model: bedrock/amazon.titan-embed-text-v2:0
    litellm_params: {aws_region_name: ca-central-1}
    mode: embedding
    region: ca-central-1
    input_per_million: 0.10
    output_per_million: 0.0
    note: the kept runs record no embedding call, so no cost line uses this entry
    source: labs/ch06/cost/cost-sheet.yaml
    sheet:
      input_per_million: [bedrock, titan_text_embeddings_v2, ca-central-1, input_per_million]
    date: 2026-10-29   # fetched; AmazonBedrock offer for ca-central-1 published 2026-10-28
    page: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/ca-central-1/index.json

  - id: gpt-4o-canada-east
    alias: larkspur-chat
    gateway: azure
    chapter: 8
    model: gpt-4o 2024-11-20, a Standard deployment in Canada East
    litellm_model: azure/gpt-4o-2024-11-20
    litellm_params: {}
    region: canadaeast
    input_per_million: 3.025
    output_per_million: 12.1
    cached_input_per_million: 1.513
    note: the page's pay-per-token row for a regional deployment, "GPT-4o-2024-1120 Regional"
    source: labs/ch08/cost/cost-sheet.yaml
    sheet:
      input_per_million: [chat_tokens, per_million_tokens, input]
      output_per_million: [chat_tokens, per_million_tokens, output]
      cached_input_per_million: [chat_tokens, per_million_tokens, cached_input]
    date: 2026-10-29
    page: https://azure.microsoft.com/en-us/pricing/details/azure-openai/

  - id: gemini-3.5-flash-montreal
    alias: larkspur-chat
    gateway: google
    chapter: 7
    model: Gemini 3.5 Flash in Montréal (ch07:88)
    litellm_model: vertex_ai/gemini-3.5-flash
    litellm_params: {vertex_location: northamerica-northeast1}
    region: northamerica-northeast1
    input_per_million: null
    output_per_million: null
    reason: labs/ch07/cost/cost-sheet.yaml prices Agent Platform's runtime, gateway, sessions and memory, not Gemini's tokens, and section 8.8 has no Gemini token price
    source: labs/ch07/cost/cost-sheet.yaml
    date: 2026-10-29
    page: https://cloud.google.com/products/gemini-enterprise-agent-platform/pricing

  # Not an alias: the hosted price chapter 9's crossover sets against its GPUs (labs/ch09/cost/crossover.py).
  - id: bedrock-gpt-oss-120b-use1
    alias: null
    gateway: null
    chapter: 9
    model: gpt-oss-120b on Amazon Bedrock's Standard tier in us-east-1
    litellm_model: bedrock/openai.gpt-oss-120b-1:0
    litellm_params: {aws_region_name: us-east-1}
    region: us-east-1
    input_per_million: 0.15
    output_per_million: 0.60
    source: labs/ch09/cost/cost-sheet.yaml
    sheet:
      input_per_million: [hosted, bedrock-gpt-oss-120b-standard, input_per_million]
      output_per_million: [hosted, bedrock-gpt-oss-120b-standard, output_per_million]
    date: 2026-10-28
    page: https://aws.amazon.com/bedrock/pricing/

# The guardrail chapter 6 runs before and after every call on the managed aliases. The cost lines don't
# carry it: LiteLLM prices the model's tokens, and the guardrail bills text units of up to 1,000
# characters, per policy. The ledger estimates it apart (price.guardrail_estimate).
guardrail:
  id: bedrock-guardrail-ca
  what: Amazon Bedrock Guardrails in ca-central-1, before and after each call on the managed aliases
  applies_to: [larkspur-chat, larkspur-chat-fallback]   # labs/ch06/gateway/litellm.aws.yaml, the managed aliases
  calls: [pre_call, post_call]                          # mode in the same file
  policies: [content_filters, sensitive_information]    # labs/ch06/terraform/guardrail.tf: content (with prompt attacks) and PII
  per_1000_text_units:
    content_filters: 0.15
    denied_topics: 0.15
    sensitive_information: 0.10
    contextual_grounding: 0.10
    word_filters: 0.0
  text_unit_characters: 1000
  characters_per_token: 4   # an estimate, not a price: LiteLLM's DEFAULT_CHARS_PER_TOKEN (fact sheet 8.1); the cost lines keep tokens
  source: labs/ch06/cost/cost-sheet.yaml
  sheet:
    content_filters: [bedrock, guardrails_per_1000_text_units, ca-central-1, content_filters]
    denied_topics: [bedrock, guardrails_per_1000_text_units, ca-central-1, denied_topics]
    sensitive_information: [bedrock, guardrails_per_1000_text_units, ca-central-1, sensitive_information]
    contextual_grounding: [bedrock, guardrails_per_1000_text_units, ca-central-1, contextual_grounding]
    word_filters: [bedrock, guardrails_per_1000_text_units, ca-central-1, word_filters]
  date: 2026-10-29
  page: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/ca-central-1/index.json

