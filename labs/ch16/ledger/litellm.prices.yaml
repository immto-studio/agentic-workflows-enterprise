# Generated by ledger/price.py from ledger/prices.yaml (python ledger/price.py --write-litellm); a test
# fails when the two differ, so change prices.yaml and regenerate.
#
# The dated table as LiteLLM custom prices, one model_list per gateway pair: the part of each gateway's
# config that carries prices (chapter 6's AWS pair, chapter 8's Azure pair). Per-million prices become
# per-token ones. A deployment's custom price wins over LiteLLM's built-in map, which has no entry for the
# Canadian profile. The self-hosted alias is priced at exactly zero, which makes LiteLLM skip every budget
# check for it; its stop is each manifest's requests_per_minute. Credentials, timeouts, guardrails and the
# fallback chain stay in each gateway's own config (labs/ch06/gateway/litellm.aws.yaml). Gemini in Montréal
# has no price in any source, so it isn't here; LiteLLM would price it from its own map.
aws:
  model_list:
  - model_name: larkspur-chat
    litellm_params:
      model: bedrock/converse/ca.amazon.nova-lite-v1:0
      aws_region_name: ca-central-1
      input_cost_per_token: 6.4e-08
      output_cost_per_token: 2.56e-07
    model_info:
      id: nova-lite-ca
      region: ca-central-1
  - model_name: larkspur-chat-fallback
    litellm_params:
      model: bedrock/converse/amazon.nova-lite-v1:0
      aws_region_name: us-east-2
      input_cost_per_token: 6.0e-08
      output_cost_per_token: 2.4e-07
    model_info:
      id: nova-lite-us
      region: us-east-2
  - model_name: larkspur-chat-restricted
    litellm_params:
      model: hosted_vllm/gpt-oss-20b
      api_base: http://vllm-gpt-oss-20b.llm-serving.svc:8080/v1
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
    model_info:
      id: vllm-gpt-oss-20b
      region: ca-central-1
  - model_name: larkspur-embed
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: ca-central-1
      input_cost_per_token: 1.0e-07
      output_cost_per_token: 0.0
    model_info:
      id: titan-embed-v2-ca
      region: ca-central-1
      mode: embedding
azure:
  model_list:
  - model_name: larkspur-chat
    litellm_params:
      model: azure/gpt-4o-2024-11-20
      input_cost_per_token: 3.025e-06
      output_cost_per_token: 1.21e-05
    model_info:
      id: gpt-4o-canada-east
      region: canadaeast
